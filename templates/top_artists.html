<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Artists - Spotify Stats</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <h1 class="display-4 mb-4 text-spotify-green">Your Top Artists</h1>
        <div class="card bg-dark border-light mb-4">
            <div class="card-body">
                <h2 class="card-title text-spotify-green">Most Listened Artists</h2>
                <ul class="list-group list-group-flush bg-dark">
                    {% for artist in artists %}
                        <li class="list-group-item bg-dark text-white">
                            {{ artist.name }} (Popularity: {{ artist.popularity }}) - Genres: {{ artist.genres }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-spotify btn-lg">Back to Dashboard</a>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
